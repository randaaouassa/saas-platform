services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      target: dev
    env_file: .env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.core.celery_app worker -Q default,notifications,routing,analytics -l info

  beat:
    build:
      context: ./backend
      target: dev
    env_file: .env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis: { condition: service_healthy }
    command: celery -A app.core.celery_app beat -l info

volumes:
  pgdata: