[project]
name = "saas-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "python-jose[cryptography]",
    "bcrypt",
    "python-multipart",
    "email-validator",
    "celery",
    "uuid6",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",
    "UP017",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E402"]
"alembic/*" = ["F401", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -W ignore::DeprecationWarning"